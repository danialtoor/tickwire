name: Nightly demo reset

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC, before US market hours
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Purge expired guests
        run: |
          curl -fsS -X POST "${{ vars.PROD_API_URL || 'https://tickwire-api.fly.dev' }}/admin/reset" \
            -H "X-Admin-Key: ${{ secrets.TICKWIRE_ADMIN_KEY }}"
