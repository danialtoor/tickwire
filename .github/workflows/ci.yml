name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    name: .NET build & test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release -warnaserror
      - name: Test (unit, property, QuickFIX/n interop, in-process API, Testcontainers MySQL on Linux)
        run: dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --results-directory coverage --logger "trx;LogFilePrefix=${{ matrix.os }}"
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator -reports:"coverage/**/coverage.cobertura.xml" -targetdir:coverage/report \
            -reporttypes:"MarkdownSummaryGithub;Badges" -assemblyfilters:"+Tickwire.Fix;+Tickwire.Fix.Session;+Tickwire.Engine;+Tickwire.Venue;+Tickwire.Pricing;+Tickwire.LogAnalyzer"
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: coverage/
          retention-days: 14

  web:
    name: Web (lint, typecheck, unit, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (docker compose + smoke + Playwright + Pester)
    runs-on: ubuntu-latest
    needs: [build-test, web]
    steps:
      - uses: actions/checkout@v4
      - name: Start MySQL + API
        run: |
          cp .env.example .env
          docker compose up -d --build --wait
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/health
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Smoke (REST + raw TCP FIX)
        run: scripts/smoke.sh http://localhost:8080 localhost:9878
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --grep @local
      - name: PowerShell module (Pester + PSScriptAnalyzer)
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path tools/powershell -Recurse -Severity Error,Warning -ExcludeRule PSAvoidUsingWriteHost
          $issues | Format-Table -AutoSize
          if ($issues) { throw "PSScriptAnalyzer found $($issues.Count) issue(s)" }
          $env:TICKWIRE_API = 'http://localhost:8080'
          $r = Invoke-Pester tools/powershell -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) Pester test(s) failed" }
      - name: Restart API, sequence numbers must survive
        run: |
          docker compose restart api
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://localhost:8080/health
          scripts/smoke.sh http://localhost:8080 localhost:9878
      - name: API logs
        if: failure()
        run: docker compose logs api --tail 300
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  powershell-windows:
    name: PowerShell module on Windows
    runs-on: windows-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Start API (in-memory)
        shell: pwsh
        run: |
          Start-Process dotnet -ArgumentList 'run','--project','src/Tickwire.Api','-c','Release','--no-launch-profile' `
            -Environment @{ ASPNETCORE_URLS = 'http://localhost:8080'; Tickwire__AdminKey = 'ci' } -RedirectStandardOutput api.log
          for ($i = 0; $i -lt 90; $i++) { try { Invoke-RestMethod http://localhost:8080/health; break } catch { Start-Sleep 2 } }
      - name: Pester
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser
          $r = Invoke-Pester tools/powershell -PassThru -Output Detailed
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) Pester test(s) failed" }

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
