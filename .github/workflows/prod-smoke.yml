name: Production smoke

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  issues: write

env:
  API: ${{ vars.PROD_API_URL || 'https://tickwire-api.fly.dev' }}
  FIX: ${{ vars.PROD_FIX_ENDPOINT || 'tickwire-api.fly.dev:9878' }}
  WEB: ${{ vars.PROD_WEB_URL || 'https://tickwire.vercel.app' }}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Smoke (REST + raw TCP FIX)
        run: scripts/smoke.sh "$API" "$FIX"
      - uses: actions/setup-node@v4
        if: github.event_name != 'schedule'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Playwright against production
        if: github.event_name != 'schedule'
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          PLAYWRIGHT_BASE_URL="$WEB" npx playwright test --grep @prod
      - name: Open an issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Production smoke test failing'
            const open = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'incident' })
            if (open.data.some(i => i.title === title)) return
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo, title, labels: ['incident'],
              body: `The scheduled smoke test failed: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nSee docs/runbook.md.`,
            })
