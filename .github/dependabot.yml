version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule: { interval: weekly }
    groups:
      dotnet: { patterns: ['*'] }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ['*'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
